[package]
name = "agoc"
version = "0.1.0"
edition = "2021"
description = "External-IP gate for Claude, OpenAI and Copilot destination addresses (Linux, macOS, Windows)"
license = "MIT"
default-run = "agoc"

[features]
tray = ["dep:ksni", "dep:tao", "dep:tray-icon", "dep:tempfile", "dep:image"]

[[bin]]
name = "agoc-tray"
path = "src/bin/agoc-tray.rs"
required-features = ["tray"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"], optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = { version = "0.34", optional = true }
tray-icon = { version = "0.21", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
